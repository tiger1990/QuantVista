# QuantVista job/pipeline alert rules (QV-020, plans/08 §7).
# Thresholds are deliberately generous for a T-1 daily feed across weekends — tune on staging.
# Freshness lag is derived here (time() - timestamp gauge), never a stale pre-computed number.
groups:
  - name: quantvista-pipeline
    rules:
      - alert: PipelineFreshnessLagHigh
        # 129600s = 36h: covers a normal T-1 daily bar plus a weekend gap before we page.
        expr: time() - data_latest_ingest_timestamp_seconds{dataset="daily_prices"} > 129600
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "daily_prices freshness lag exceeds 36h"
          runbook: "Check ingest_daily_prices job runs (jobs_runs) and the provider feed."

      - alert: JobFailureRateHigh
        # Any task failure accumulating over 15m — job success SLO is >99% (08 §7).
        expr: increase(celery_task_failures_total[15m]) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "Celery task failures in the last 15m"
          runbook: "Inspect the failing task in jobs_runs + worker logs; check DLQ."

      - alert: QueueBacklogHigh
        # Sustained backlog on the default queue — proxy for DLQ/backpressure (08 §7).
        expr: celery_queue_depth{queue="default"} > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Celery default queue backlog above 100"
          runbook: "Check worker health/concurrency; look for a stuck or slow task."

      # Derived-data coverage (QV-105). NOT a freshness check: indicators once carried the same
      # max(date) as prices while missing 268 of 286 sessions, so the freshness gauge read
      # perfectly healthy and every backtest over that history silently returned zeros.
      # `technical_indicators` is what the backtest engine ranks on, so a sustained gap pages.
      - alert: BacktestInputCoverageGap
        expr: data_coverage_gap_sessions{dataset="technical_indicators"} > 5
        for: 1h
        labels:
          severity: page
        annotations:
          summary: "technical_indicators is missing priced sessions — backtests will return zeros"
          runbook: "Run backfill_indicators over the gap (scripts/dev_backfill.py, or force=True to repair partial dates)."

      # Stored factors/scores feed rankings and score history, not the backtest engine, so a gap
      # degrades those surfaces without corrupting results — warn rather than page.
      - alert: DerivedDataCoverageGap
        expr: data_coverage_gap_sessions{dataset=~"factor_values|scores"} > 20
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Derived dataset is missing priced sessions — rankings/score history will be sparse"
          runbook: "Run backfill_factors_and_scores over the gap; check compute_factors/compute_scores in jobs_runs."
